<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bagdrop — offline</title>
<style>
  :root { --brand: #f97316; --ink: #1c1917; --muted: #78716c; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #fff; color: var(--ink); padding: 16px; }
  .card { text-align: center; max-width: 420px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: var(--brand);
          color: #fff; font-weight: 800; font-size: 34px; display: inline-grid;
          place-items: center; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 999px;
           padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #fafaf9; }
    p { color: #a8a29e; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">B</div>
    <h1>You&rsquo;re offline</h1>
    <p>Bagdrop needs a connection to fetch live rates and book your pickup.
       Your in-progress booking is safe — reconnect and continue where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
